<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e1) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(fn) {
                protoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        window.addEventListener('error', function(event) {
          if (
            event.message &&
            event.message.indexOf('Cannot set property fetch of #<Window>') !== -1
          ) {
            event.preventDefault();
          }
        });

        try {
          var savedTheme = localStorage.getItem('app_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (eTheme) {}
      })();
    </script>
    <title>IronLog</title>
    <meta name="description" content="IronLog - Aplicativo pessoal para organizar rotina de treinos semanais, planejamento de refeições, controle diário de água e assistente de musculação e nutrição esportiva." />
